services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: fe_radar
      POSTGRES_USER: fe_radar
      POSTGRES_PASSWORD: fe_radar_dev
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - fe_radar_dev_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fe_radar"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - fe_radar_dev_redis:/data

volumes:
  fe_radar_dev_pg:
  fe_radar_dev_redis:

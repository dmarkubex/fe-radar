stages:
  - test

# 假设 GitLab Runner = docker executor。如果 runner 是 shell/kubernetes，
# 把 image: 行删掉、services: 删掉，并改用 runner 自带的 postgres/node。

e2e:
  stage: test
  # 官方 Playwright 镜像，自带 Node 22 + chromium，避免内网下载浏览器二进制
  image: mcr.microsoft.com/playwright:v1.59.1-jammy
  services:
    - name: postgres:16
      alias: postgres
    - name: redis:7
      alias: redis
  variables:
    POSTGRES_USER: fe_radar
    POSTGRES_PASSWORD: fe_radar
    POSTGRES_DB: fe_radar
    DATABASE_URL: postgres://fe_radar:fe_radar@postgres:5432/fe_radar
    AUTH_SECRET: fe-radar-e2e-secret-fe-radar-e2e-secret
    NEXTAUTH_SECRET: fe-radar-e2e-secret-fe-radar-e2e-secret
    NEXTAUTH_URL: http://localhost:3000
    MIGRATION_PROFILE: e2e
    SEED_ADMIN_USERNAME: admin
    SEED_ADMIN_PASSWORD: admin-password
    SEED_VIEWER_USERNAME: viewer
    SEED_VIEWER_PASSWORD: viewer-password
    E2E_ADMIN_USERNAME: admin
    E2E_ADMIN_PASSWORD: admin-password
    E2E_VIEWER_USERNAME: viewer
    E2E_VIEWER_PASSWORD: viewer-password
    # Playwright 镜像里浏览器路径
    PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - corepack enable
    - corepack prepare pnpm@11.0.9 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  script:
    - pnpm --filter @fe-radar/db migrate
    - pnpm --filter @fe-radar/db seed:admin
    - pnpm --filter @fe-radar/web build
    - pnpm --filter @fe-radar/web e2e
  artifacts:
    when: always
    paths:
      - apps/web/playwright-report/
      - apps/web/test-results/
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

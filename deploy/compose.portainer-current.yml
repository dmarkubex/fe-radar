# FE-Radar — 当前 Portainer 线上 stack（已修复 entrypoint 清空 CMD 的坑）
#
# 修复点（相对你贴出的线上版本）：
#   - web:    覆盖 entrypoint 会清空镜像 CMD ["pnpm","start"] → 补回 command:，否则 Next.js 不启动、容器空转重启、3013 端口连不上
#   - worker: 同理补回 command: ["node","dist/apps/worker/src/main.js"]
#   - scheduler 本来就有 command:，正常，无需改
#
# 这是你手改的「跳过 migrate / 3013 端口」恢复版，不是仓库 canonical 文件（canonical 见 stack.yml）。
# 粘贴进 Portainer → Stacks → 你的 stack → Editor → Update the stack 即可。
# 合并日报钉钉推送调度在 DB daily_push_config（默认 enabled=false），不在 compose 硬编码发送时间。

services:
  postgres:
    image: harborssl.fegroup.cn/custom-project/fe-radar/postgres-zhparser:pg16
    environment:
      POSTGRES_DB: fe_radar
      POSTGRES_USER: fe_radar
      POSTGRES_PASSWORD: ${DB_PASSWORD:?在 Portainer stack 环境变量填 DB_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # T-SEC-13: 不发布 5432 到宿主机接口（短语法默认绑全部接口，绕过 web 鉴权直接暴露
    # DB 认证面）。临时排查用 `docker exec` 进容器 psql，或 SSH tunnel 仅绑 127.0.0.1。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fe_radar -d fe_radar"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: harborssl.fegroup.cn/custom-project/redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redis_data:/data
    restart: unless-stopped

  rsshub:
    image: harborssl.fegroup.cn/custom-project/rsshub:latest
    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      CACHE_EXPIRE: "3600"
      REDIS_URL: redis://redis:6379
      # jiemian.com / yicai.com 回源慢（内网出口），放宽 RSSHub 上游超时 + 重试，避免反复 503
      REQUEST_TIMEOUT: "30000"
      REQUEST_RETRY: "2"
    restart: unless-stopped

  # 一次性迁移 + seed：真迁移已恢复（migrate.ts 顺序跑 migrations/*.sql）。
  # 全部幂等可重跑：建表 IF NOT EXISTS、约束 DO$$ IF NOT EXISTS pg_constraint、
  # 0005 索引 DROP IF EXISTS 再建、信源 seed ON CONFLICT(url) DO NOTHING。
  # ⚠ 副作用：0005 会重建 ivfflat 索引；信源 seed 不覆盖 admin 后台配置。
  # ⚠ 0017 等最新 migration 生效，必须用最新源码重建并推送 fe-radar-migrate:latest。
  migrate:
    image: harborssl.fegroup.cn/custom-project/fe-radar-migrate:latest
    command:
      - sh
      - -c
      - "pnpm --filter @fe-radar/db migrate && pnpm --filter @fe-radar/db seed:admin"
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: postgres://fe_radar:${DB_PASSWORD:?在 Portainer stack 环境变量填 DB_PASSWORD}@postgres:5432/fe_radar
      SEED_ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?在 Portainer stack 环境变量填 ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  worker:
    image: harborssl.fegroup.cn/custom-project/fe-radar-worker:latest
    entrypoint:
      - /bin/sh
      - "-c"
      - 'tr -d ''\015'' < /usr/local/bin/fe-entrypoint.sh > /tmp/fe-entrypoint.sh && exec /bin/sh /tmp/fe-entrypoint.sh "$@"'
      - "--"
    command: ["node", "dist/apps/worker/src/main.js"] # 覆盖 entrypoint 会清空镜像 CMD，必须补回
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      DATABASE_URL: postgres://fe_radar:${DB_PASSWORD:?在 Portainer stack 环境变量填 DB_PASSWORD}@postgres:5432/fe_radar
      REDIS_URL: redis://redis:6379
      RSSHUB_BASE_URL: http://rsshub:1200
      # T-SEC-12 / S5: SSRF 守卫默认拒绝内网/非标端口；容器内抓 rsshub:1200 必须进 allowlist，
      # 否则 PORT_BLOCKED:1200 会打死 quotes-fetch 与所有经 RSSHub 的源（与 stack.yml 对齐）。
      # 最小权限：仅 RSSHub；minio/redis/postgres 不经 url-guard，不得加入。
      FETCH_INTERNAL_ALLOWLIST: rsshub
      PROXY_POOL_ENABLED: "false"
      # worker RSS 抓 RSSHub 的超时（冷缓存回源慢，4s 默认太短）；需配套新 worker 镜像才生效
      RSS_FETCH_TIMEOUT_MS: ${RSS_FETCH_TIMEOUT_MS:-15000}
      # ── LLM 配置（页面出数据的前提：流水线 prefilter/ner 调 Qwen、scorer 调 DeepSeek 写 scoredAt）──
      # 必填：内网 Qwen OpenAI 兼容端点，如 http://10.10.x.x:8001/v1（在 Portainer stack 环境变量里填）
      QWEN_BASE_URL: ${QWEN_BASE_URL:?在 Portainer stack 环境变量填内网 Qwen 地址，如 http://10.10.x.x:8001/v1}
      QWEN_MODEL: ${QWEN_MODEL:-qwen3.6-27b}
      # Qwen embedding 端点（聚类用）；若 Qwen 同端点提供 embeddings 可省略，默认回退到 QWEN_BASE_URL
      QWEN_EMBEDDING_BASE_URL: ${QWEN_EMBEDDING_BASE_URL:-}
      QWEN_EMBEDDING_MODEL: ${QWEN_EMBEDDING_MODEL:-qwen-embedding-1024}
      # 必填：DeepSeek key（scorer 评分/摘要，写 scoredAt → 决定 item 是否在 timeline 可见）
      # ⚠ DeepSeek 是公网 api.deepseek.com，内网服务器须确认有出口可达；不可达则改 DEEPSEEK_BASE_URL 指向内网网关
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?在 Portainer stack 环境变量填 DeepSeek API key}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
      # 选填：Kimi key（只影响每日日报，不影响 timeline 出数据，可暂缺）
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      # Firecrawl C1 风险检索：二选一
      # ① Portainer stack 环境变量填 FIRECRAWL_API_KEY（compose 必须显式引用才会注入容器）
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      # ② secret 方案：docker secret create firecrawl_api_key … 后取消注释下一行
      # FIRECRAWL_API_KEY_FILE: /run/secrets/firecrawl_api_key
      FIRECRAWL_BASE_URL: ${FIRECRAWL_BASE_URL:-https://api.firecrawl.dev/v2}
      REQUIRE_DB_TABLES: public.sources,public.items,public.item_analysis,public.users,public.commodity_briefings,public.commodity_quotes,public.briefing_targets,public.briefing_template_fields,public.daily_push_config,public.daily_pushes
      DB_WAIT_TIMEOUT_SECONDS: "180"
      # ── v1.1 商品简报渲染：MinIO 上传 + docx 模板（与 stack.yml 对齐；本文件此前缺失，
      #    从此 compose 部署会抹掉线上已有配置，导致渲染失败 / 下载 410）──
      BRIEFING_TEMPLATE_PATH: /app/design/templates/briefing.docx
      BRIEFING_MINIO_BUCKET: fe-radar-briefings
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      # T-SEC-17: worker 改用 scoped service account（按 docs/runbook/minio-least-privilege.md 预建），
      # 不再挂 root 凭据。entrypoint（fe-entrypoint.sh）读 *_FILE → 注入明文 MINIO_ACCESS_KEY/SECRET_KEY。
      MINIO_ACCESS_KEY_FILE: /run/secrets/minio_worker_access_key
      MINIO_SECRET_KEY_FILE: /run/secrets/minio_worker_secret_key
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped
    secrets:
      - minio_worker_access_key
      - minio_worker_secret_key

  scheduler:
    image: harborssl.fegroup.cn/custom-project/fe-radar-worker:latest
    entrypoint:
      - /bin/sh
      - "-c"
      - 'tr -d ''\015'' < /usr/local/bin/fe-entrypoint.sh > /tmp/fe-entrypoint.sh && exec /bin/sh /tmp/fe-entrypoint.sh "$@"'
      - "--"
    command: ["node", "dist/apps/worker/src/scheduler-main.js"]
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      DATABASE_URL: postgres://fe_radar:${DB_PASSWORD:?在 Portainer stack 环境变量填 DB_PASSWORD}@postgres:5432/fe_radar
      REDIS_URL: redis://redis:6379
      REQUIRE_DB_TABLES: public.sources,public.items,public.item_analysis,public.users,public.commodity_briefings,public.commodity_quotes,public.briefing_targets,public.briefing_template_fields,public.daily_push_config,public.daily_pushes
      DB_WAIT_TIMEOUT_SECONDS: "180"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped

  web:
    image: harborssl.fegroup.cn/custom-project/fe-radar-web:latest
    entrypoint:
      - /bin/sh
      - "-c"
      - 'tr -d ''\015'' < /usr/local/bin/fe-entrypoint.sh > /tmp/fe-entrypoint.sh && exec /bin/sh /tmp/fe-entrypoint.sh "$@"'
      - "--"
    command: ["pnpm", "start"] # 覆盖 entrypoint 会清空镜像 CMD ["pnpm","start"]，必须补回，否则 Next.js 不启动
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      DATABASE_URL: postgres://fe_radar:${DB_PASSWORD:?在 Portainer stack 环境变量填 DB_PASSWORD}@postgres:5432/fe_radar
      REDIS_URL: redis://redis:6379
      # S2 / 登录限速 IP 维度：
      # TRUST_PROXY_HEADERS — 仅当前面有会重写 X-Forwarded-For 的可信代理
      # （如 Nginx `$proxy_add_x_forwarded_for`）时设为 "true"，才启用 IP 维度登录限速并解析 XFF。
      # 当前部署：直发 published 端口、无重写 XFF 的可信代理层 → 保持默认关闭
      # （不设或 "false"）。关闭时仅用 peer 地址；取不到则跳过 IP 维度（username 限速仍生效），
      # 绝不回退共享 "unknown" 键（防伪造 XFF 绕过 / 故意无 XFF 锁死全员）。
      # 若日后前置 Nginx/CDN 并正确追加 XFF，再显式设 TRUST_PROXY_HEADERS=true，
      # 可选 TRUSTED_PROXY_HOPS（默认 1 = 单层代理，取 XFF 右数第 hops 项）。
      # TRUST_PROXY_HEADERS: "false"
      # 从局域网/其他机器访问时必须设成实际访问地址，否则登录回调失败。
      # S5 / T-SEC-16: 生产启动要求 AUTH_URL/NEXTAUTH_URL 非空。内网 only 允许 http://
      # （instrumentation 打 WARN 并强制 Secure cookie=false，不再 throw 导致 crash-loop）。
      # 切外网时必须改为 https://...，见 docs/runbook/external-https-deployment.md。
      NEXTAUTH_URL: ${NEXTAUTH_URL:?在 Portainer 填实际访问 origin：内网可 http://10.1.20.156:3013；外网必须 https://...}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?在 Portainer stack 环境变量填 NEXTAUTH_SECRET}
      # ── 钉钉扫码登录（普通员工用；不开则登录页只有 admin 本地账号）──
      # 钉钉应用后台必须把回调地址设成 http://10.1.20.156:3013/api/auth/callback/dingtalk
      DINGTALK_ENABLED: "true"
      DINGTALK_APP_KEY: ${DINGTALK_APP_KEY:?在 Portainer stack 环境变量填钉钉 AppKey}
      DINGTALK_APP_SECRET: ${DINGTALK_APP_SECRET:?在 Portainer stack 环境变量填钉钉 AppSecret}
      DINGTALK_CORP_ID: ${DINGTALK_CORP_ID:?在 Portainer stack 环境变量填钉钉 CorpId}
      # 应急兜底：SSO 故障时仍允许 admin 用本地账号密码登录（dingtalk-provider.ts:isLocalLoginAllowed）
      # T-SEC-02 / T-SEC-08: 默认关闭，仅排障时显式设 EMERGENCY_LOCAL_LOGIN=true 开启；
      # 常态开启等于把无限尝试的本地凭据入口长期暴露在内网/外网。
      EMERGENCY_LOCAL_LOGIN: ${EMERGENCY_LOCAL_LOGIN:-false}
      REQUIRE_DB_TABLES: public.sources,public.items,public.item_analysis,public.users,public.commodity_briefings,public.commodity_quotes,public.briefing_targets,public.briefing_template_fields,public.daily_push_config,public.daily_pushes
      DB_WAIT_TIMEOUT_SECONDS: "180"
      # ── v1.1 商品简报下载：MinIO 只读（与 stack.yml 对齐；此前缺失，
      #    从此 compose 部署会抹掉线上已有配置 → 下载 statObject/getObject 失败 / 410）──
      BRIEFING_MINIO_BUCKET: fe-radar-briefings
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      # T-SEC-17: web 改用 scoped 只读 service account（按 docs/runbook/minio-least-privilege.md 预建），
      # 不再挂 root 凭据。entrypoint（fe-entrypoint.sh）读 *_FILE → 注入明文 MINIO_ACCESS_KEY/SECRET_KEY。
      MINIO_ACCESS_KEY_FILE: /run/secrets/minio_web_access_key
      MINIO_SECRET_KEY_FILE: /run/secrets/minio_web_secret_key
    ports:
      - "3013:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    secrets:
      - minio_web_access_key
      - minio_web_secret_key

  # MinIO 对象存储（v1.1 商品简报 docx）。canonical stack.yml 已有此 service；本文件此前缺失 →
  # 从本 compose 部署会把线上 minio 抹掉，简报渲染/下载全挂。root 凭据仅本 service 持有，
  # web/worker/backup 用 scoped service account（见 docs/runbook/minio-least-privilege.md）。
  minio:
    image: harborssl.fegroup.cn/custom-project/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets:
      - minio_root_user
      - minio_root_password
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:

secrets:
  # T-SEC-17: MinIO root 仅 minio service 持有；web/worker/backup 用 scoped 账号。
  # 按 docs/runbook/minio-least-privilege.md 预建后，在 Portainer 用同名 external secret 创建。
  minio_root_user:
    external: true
  minio_root_password:
    external: true
  minio_web_access_key:
    external: true
  minio_web_secret_key:
    external: true
  minio_worker_access_key:
    external: true
  minio_worker_secret_key:
    external: true

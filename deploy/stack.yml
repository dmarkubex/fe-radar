version: "3.9"

services:
  web:
    image: harborssl.fegroup.cn/custom-project/fe-radar/web:latest
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      DATABASE_URL: postgres://fe_radar:${DB_PASSWORD}@postgres:5432/fe_radar
      REDIS_URL: redis://redis:6379
      NEXTAUTH_URL: http://fe-radar.internal
      NEXTAUTH_SECRET_FILE: /run/secrets/nextauth_secret
      REQUIRE_DB_TABLES: public.sources,public.items,public.item_analysis,public.users,public.commodity_briefings,public.commodity_quotes,public.briefing_targets,public.briefing_template_fields
      DB_WAIT_TIMEOUT_SECONDS: "180"
      BRIEFING_MINIO_BUCKET: fe-radar-briefings
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY_FILE: /run/secrets/minio_root_user
      MINIO_SECRET_KEY_FILE: /run/secrets/minio_root_password
    secrets:
      - nextauth_secret
      - db_password
      - minio_root_user
      - minio_root_password
    networks:
      - internal
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  worker:
    image: harborssl.fegroup.cn/custom-project/fe-radar/worker:latest
    # 入口用镜像默认 CMD（dist/apps/worker/src/main.js）；不要覆盖成 dist/main.js（不存在）
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      DATABASE_URL: postgres://fe_radar:${DB_PASSWORD}@postgres:5432/fe_radar
      REDIS_URL: redis://redis:6379
      REQUIRE_DB_TABLES: public.sources,public.items,public.item_analysis,public.users,public.commodity_briefings,public.commodity_quotes,public.briefing_targets,public.briefing_template_fields
      DB_WAIT_TIMEOUT_SECONDS: "180"
      QWEN_BASE_URL: ${QWEN_BASE_URL:?set QWEN_BASE_URL in Portainer stack environment}
      QWEN_MODEL: ${QWEN_MODEL:-qwen3.6-27b}
      PROXY_POOL_ENABLED: "false"
      PROXY_LIST_FILE: /run/secrets/proxy_list
      DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_api_key
      KIMI_API_KEY_FILE: /run/secrets/kimi_api_key
      RSSHUB_BASE_URL: http://rsshub:1200
      BRIEFING_TEMPLATE_PATH: /app/design/templates/briefing.docx
      BRIEFING_MINIO_BUCKET: fe-radar-briefings
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY_FILE: /run/secrets/minio_root_user
      MINIO_SECRET_KEY_FILE: /run/secrets/minio_root_password
    secrets:
      - db_password
      - deepseek_api_key
      - kimi_api_key
      - proxy_list
      - minio_root_user
      - minio_root_password
    networks:
      - internal
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure

  scheduler:
    image: harborssl.fegroup.cn/custom-project/fe-radar/worker:latest
    command: ["node", "dist/apps/worker/src/scheduler.js"]
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      DATABASE_URL: postgres://fe_radar:${DB_PASSWORD}@postgres:5432/fe_radar
      REDIS_URL: redis://redis:6379
      REQUIRE_DB_TABLES: public.sources,public.items,public.item_analysis,public.users,public.commodity_briefings,public.commodity_quotes,public.briefing_targets,public.briefing_template_fields
      DB_WAIT_TIMEOUT_SECONDS: "180"
    secrets:
      - db_password
    networks:
      - internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  postgres:
    image: harborssl.fegroup.cn/custom-project/fe-radar/postgres-zhparser:pg16
    environment:
      POSTGRES_DB: fe_radar
      POSTGRES_USER: fe_radar
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      TZ: Asia/Shanghai
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  redis:
    image: harborssl.fegroup.cn/custom-project/redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redis_data:/data
    networks:
      - internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  minio:
    image: harborssl.fegroup.cn/custom-project/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets:
      - minio_root_user
      - minio_root_password
    volumes:
      - minio_data:/data
    networks:
      - internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  backup:
    image: harborssl.fegroup.cn/custom-project/fe-radar/backup:latest
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: postgres://fe_radar:${DB_PASSWORD}@postgres:5432/fe_radar
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY_FILE: /run/secrets/minio_root_user
      MINIO_SECRET_KEY_FILE: /run/secrets/minio_root_password
      MINIO_BUCKET: fe-radar-backups
      RETENTION_DAYS: "7"
    secrets:
      - db_password
      - minio_root_user
      - minio_root_password
    networks:
      - internal
    deploy:
      replicas: 0
      restart_policy:
        condition: none

  grafana:
    image: harborssl.fegroup.cn/custom-project/grafana/grafana:12.1.1
    environment:
      TZ: Asia/Shanghai
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in Portainer stack environment}
      GRAFANA_DINGTALK_WEBHOOK_URL: ${GRAFANA_DINGTALK_WEBHOOK_URL:?set GRAFANA_DINGTALK_WEBHOOK_URL in Portainer stack environment}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
    secrets:
      - grafana_admin_password
    configs:
      - source: grafana_datasource_postgres
        target: /etc/grafana/provisioning/datasources/postgres.yaml
      - source: grafana_dashboard_provider
        target: /etc/grafana/provisioning/dashboards/fe-radar.yaml
      - source: grafana_alerts_commodity
        target: /etc/grafana/provisioning/alerting/commodity-briefing.yaml
      - source: grafana_alerts_core
        target: /etc/grafana/provisioning/alerting/fe-radar-core.yaml
      - source: grafana_contact_points
        target: /etc/grafana/provisioning/alerting/contact-points.yaml
      - source: grafana_dashboard_ops
        target: /etc/grafana/dashboards/fe-radar.json
      - source: grafana_dashboard_commodity
        target: /etc/grafana/dashboards/commodity-briefing.json
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # v1.1 commodity-briefing: RSSHub 内网自部署（供 rsshub-extract adapter 使用）
  rsshub:
    image: harborssl.fegroup.cn/custom-project/diygod/rsshub@sha256:0d40e1c9e5c3811da2c4eeaf7443e1bcdc6d7dc5510aa3df98bab0f979c03059
    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      CACHE_EXPIRE: "3600"
      REDIS_URL: redis://redis:6379
    networks:
      - internal
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M
          cpus: "0.10"
      restart_policy:
        condition: any
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1200/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  internal:
    driver: overlay
    internal: true

volumes:
  postgres_data:
  redis_data:
  minio_data:
  grafana_data:

secrets:
  db_password:
    external: true
  nextauth_secret:
    external: true
  dingtalk_app_secret:
    external: true
  deepseek_api_key:
    external: true
  kimi_api_key:
    external: true
  minio_root_user:
    external: true
  minio_root_password:
    external: true
  proxy_list:
    external: true
  grafana_admin_password:
    external: true

configs:
  grafana_datasource_postgres:
    file: ./grafana/provisioning/datasources/postgres.yaml
  grafana_dashboard_provider:
    file: ./grafana/provisioning/dashboards/commodity-briefing.yaml
  grafana_alerts_commodity:
    file: ./grafana/provisioning/alerts/commodity-briefing.yaml
  grafana_alerts_core:
    file: ./grafana/provisioning/alerts/fe-radar-core.yaml
  grafana_contact_points:
    file: ./grafana/provisioning/alerts/contact-points.yaml
  grafana_dashboard_ops:
    file: ./grafana/dashboards/fe-radar.json
  grafana_dashboard_commodity:
    file: ./grafana/dashboards/commodity-briefing.json

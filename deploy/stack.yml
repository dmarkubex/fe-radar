version: "3.9"

services:
  web:
    image: harborssl.fegroup.cn/custom-project/fe-radar/web:latest
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      DATABASE_URL: postgres://fe_radar:${DB_PASSWORD}@postgres:5432/fe_radar
      REDIS_URL: redis://redis:6379
      NEXTAUTH_URL: http://fe-radar.internal
      NEXTAUTH_SECRET_FILE: /run/secrets/nextauth_secret
    secrets:
      - nextauth_secret
      - db_password
    networks:
      - internal
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  worker:
    image: harborssl.fegroup.cn/custom-project/fe-radar/worker:latest
    # 入口用镜像默认 CMD（dist/apps/worker/src/main.js）；不要覆盖成 dist/main.js（不存在）
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      DATABASE_URL: postgres://fe_radar:${DB_PASSWORD}@postgres:5432/fe_radar
      REDIS_URL: redis://redis:6379
      PROXY_POOL_ENABLED: "false"
      PROXY_LIST_FILE: /run/secrets/proxy_list
      DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_api_key
      KIMI_API_KEY_FILE: /run/secrets/kimi_api_key
      RSSHUB_BASE_URL: http://rsshub:1200
    secrets:
      - db_password
      - deepseek_api_key
      - kimi_api_key
      - proxy_list
    networks:
      - internal
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure

  scheduler:
    image: harborssl.fegroup.cn/custom-project/fe-radar/worker:latest
    command: ["node", "dist/apps/worker/src/scheduler.js"]
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      DATABASE_URL: postgres://fe_radar:${DB_PASSWORD}@postgres:5432/fe_radar
      REDIS_URL: redis://redis:6379
    secrets:
      - db_password
    networks:
      - internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  postgres:
    image: harborssl.fegroup.cn/custom-project/fe-radar/postgres-zhparser:pg16
    environment:
      POSTGRES_DB: fe_radar
      POSTGRES_USER: fe_radar
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      TZ: Asia/Shanghai
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  redis:
    image: harborssl.fegroup.cn/custom-project/redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redis_data:/data
    networks:
      - internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  minio:
    image: harborssl.fegroup.cn/custom-project/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets:
      - minio_root_user
      - minio_root_password
    volumes:
      - minio_data:/data
    networks:
      - internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  backup:
    image: harborssl.fegroup.cn/custom-project/fe-radar/backup:latest
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: postgres://fe_radar:${DB_PASSWORD}@postgres:5432/fe_radar
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY_FILE: /run/secrets/minio_root_user
      MINIO_SECRET_KEY_FILE: /run/secrets/minio_root_password
      MINIO_BUCKET: fe-radar-backups
      RETENTION_DAYS: "7"
    secrets:
      - db_password
      - minio_root_user
      - minio_root_password
    networks:
      - internal
    deploy:
      replicas: 0
      restart_policy:
        condition: none

  grafana:
    image: harborssl.fegroup.cn/custom-project/grafana/grafana:12.1.1
    environment:
      TZ: Asia/Shanghai
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
    secrets:
      - grafana_admin_password
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # v1.1 commodity-briefing: RSSHub 内网自部署（供 rsshub-extract adapter 使用）
  rsshub:
    image: harborssl.fegroup.cn/custom-project/diygod/rsshub@sha256:0d40e1c9e5c3811da2c4eeaf7443e1bcdc6d7dc5510aa3df98bab0f979c03059
    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      CACHE_EXPIRE: "3600"
      REDIS_URL: redis://redis:6379
    networks:
      - internal
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M
          cpus: "0.10"
      restart_policy:
        condition: any
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1200/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  internal:
    driver: overlay
    internal: true

volumes:
  postgres_data:
  redis_data:
  minio_data:
  grafana_data:

secrets:
  db_password:
    external: true
  nextauth_secret:
    external: true
  dingtalk_app_secret:
    external: true
  deepseek_api_key:
    external: true
  kimi_api_key:
    external: true
  minio_root_user:
    external: true
  minio_root_password:
    external: true
  proxy_list:
    external: true
  grafana_admin_password:
    external: true

version: "3.9"

services:
  web:
    image: harborssl.fegroup.cn/custom-project/fe-radar-web:${IMAGE_TAG:?在 Portainer 环境变量填不可变版本号或 digest（禁止 latest）}
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      DATABASE_URL: postgres://fe_radar:${DB_PASSWORD}@postgres:5432/fe_radar
      REDIS_URL: redis://redis:6379
      # S2 / 登录限速 IP 维度：
      # TRUST_PROXY_HEADERS — 仅当前面有会重写 X-Forwarded-For 的可信代理
      # （如 Nginx `$proxy_add_x_forwarded_for`）时设为 "true"，才启用 IP 维度登录限速并解析 XFF。
      # 当前部署：Swarm ingress 直发 published:8080，无重写 XFF 的可信代理层 → 保持默认关闭
      # （不设或 "false"）。关闭时仅用 peer 地址；取不到则跳过 IP 维度（username 限速仍生效），
      # 绝不回退共享 "unknown" 键（防伪造 XFF 绕过 / 故意无 XFF 锁死全员）。
      # 若日后前置 Nginx/CDN 并正确追加 XFF，再显式设 TRUST_PROXY_HEADERS=true，
      # 可选 TRUSTED_PROXY_HOPS（默认 1 = 单层代理，取 XFF 右数第 hops 项）。
      # TRUST_PROXY_HEADERS: "false"
      # T-SEC-16: 生产必须显式提供真实 origin（外网切换前为 https://...）。
      # auth.ts 启动时断言生产环境 origin 非空且为 https 才开 Secure cookie；
      # 去掉硬编码 http 默认，强制部署方在 Portainer 环境变量里填。
      NEXTAUTH_URL: ${NEXTAUTH_URL:?在 Portainer stack 环境变量填实际访问 origin（外网切换前为 https://...）}
      NEXTAUTH_SECRET_FILE: /run/secrets/nextauth_secret
      REQUIRE_DB_TABLES: public.sources,public.items,public.item_analysis,public.users,public.commodity_briefings,public.commodity_quotes,public.briefing_targets,public.briefing_template_fields,public.daily_push_config,public.daily_pushes,copilot.feature_flags
      DB_WAIT_TIMEOUT_SECONDS: "180"
      COPILOT_UPSTREAM_URL: http://copilot:8000
      COPILOT_INTERNAL_SECRET_FILE: /run/secrets/copilot_internal_secret
      BRIEFING_MINIO_BUCKET: fe-radar-briefings
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      # T-SEC-17 (复核 F3): web 只需读 fe-radar-briefings bucket，改用 scoped 只读 service account，
      # 不再挂 root 凭据。scoped 账号按 docs/runbook/minio-least-privilege.md 预建后填入 Portainer。
      MINIO_ACCESS_KEY_FILE: /run/secrets/minio_web_access_key
      MINIO_SECRET_KEY_FILE: /run/secrets/minio_web_secret_key
    secrets:
      - nextauth_secret
      - db_password
      - minio_web_access_key
      - minio_web_secret_key
      - copilot_internal_secret
    networks:
      - internal # 连 postgres/redis/minio
      - edge # 对外发布端口（internal 网络 internal:true，无法承载 ingress）
    ports:
      # 内网用户访问入口：http://<服务器IP>:8080 → 容器内 next start 监听的 3000
      - target: 3000
        published: 8080
        protocol: tcp
        mode: ingress
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  worker:
    image: harborssl.fegroup.cn/custom-project/fe-radar-worker:${IMAGE_TAG:?在 Portainer 环境变量填不可变版本号或 digest（禁止 latest）}
    # 入口用镜像默认 CMD（dist/apps/worker/src/main.js）；不要覆盖成 dist/main.js（不存在）
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      DATABASE_URL: postgres://fe_radar:${DB_PASSWORD}@postgres:5432/fe_radar
      REDIS_URL: redis://redis:6379
      REQUIRE_DB_TABLES: public.sources,public.items,public.item_analysis,public.users,public.commodity_briefings,public.commodity_quotes,public.briefing_targets,public.briefing_template_fields,public.daily_push_config,public.daily_pushes,copilot.feature_flags
      DB_WAIT_TIMEOUT_SECONDS: "180"
      WORKER_INTERNAL_BIND: "8071"
      SERVICE_TOKEN_WORKER_FILE: /run/secrets/service_token_worker
      QWEN_BASE_URL: ${QWEN_BASE_URL:?set QWEN_BASE_URL in Portainer stack environment}
      QWEN_MODEL: ${QWEN_MODEL:-qwen3.6-27b}
      PROXY_POOL_ENABLED: "false"
      PROXY_LIST_FILE: /run/secrets/proxy_list
      DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_api_key
      KIMI_API_KEY_FILE: /run/secrets/kimi_api_key
      # Firecrawl C1 风险检索：先创建 secret → docker secret create firecrawl_api_key <(printf 'fc-xxx')
      FIRECRAWL_API_KEY_FILE: /run/secrets/firecrawl_api_key
      # v1.2 火山方舟 Agent Plan Harness — dataPro 专业数据集
      DATAPRO_BASE_URL: https://datapro.hqd.cn-beijing.volces.com/mcp
      DATAPRO_AGENT_PLAN_KEY_FILE: /run/secrets/datapro_agent_plan_key
      # v1.2 火山方舟 Agent Plan Harness — 豆包搜索
      WEBSEARCH_API_URL: https://open.feedcoopapi.com/search_api/web_search
      WEBSEARCH_API_KEY_FILE: /run/secrets/websearch_api_key
      RSSHUB_BASE_URL: http://rsshub:1200
      # T-SEC-12 (复核 HIGH-5): SSRF 守卫默认拒绝内网/非标端口；容器内部抓取目标必须加入
      # allowlist，否则守卫上线即把 rsshub:1200 按 PORT_BLOCKED 拒掉（quotes-fetch + 财经源全灭）。
      # 最小权限：worker 唯一经抓取层访问的内部 HTTP 服务是 RSSHub；minio 走 S3 SDK、
      # redis/postgres 走各自协议，均不经过 url-guard，不得加入本名单（加入即放弃端口+IP 双检查）。
      FETCH_INTERNAL_ALLOWLIST: rsshub
      BRIEFING_TEMPLATE_PATH: /app/design/templates/briefing.docx
      BRIEFING_MINIO_BUCKET: fe-radar-briefings
      # 合并日报钉钉推送调度见 DB daily_push_config（默认 enabled=false）；worker 每分钟 tick 读库
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      # T-SEC-17 (复核 F3): worker 只需读写 fe-radar-briefings bucket，改用 scoped service account。
      MINIO_ACCESS_KEY_FILE: /run/secrets/minio_worker_access_key
      MINIO_SECRET_KEY_FILE: /run/secrets/minio_worker_secret_key
    secrets:
      - db_password
      - deepseek_api_key
      - kimi_api_key
      - firecrawl_api_key
      - datapro_agent_plan_key
      - websearch_api_key
      - proxy_list
      - minio_worker_access_key
      - minio_worker_secret_key
      - service_token_worker
    networks:
      - internal
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure

  scheduler:
    image: harborssl.fegroup.cn/custom-project/fe-radar-worker:${IMAGE_TAG:?在 Portainer 环境变量填不可变版本号或 digest（禁止 latest）}
    command: ["node", "dist/apps/worker/src/scheduler-main.js"]
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      DATABASE_URL: postgres://fe_radar:${DB_PASSWORD}@postgres:5432/fe_radar
      REDIS_URL: redis://redis:6379
      FETCH_ON_STARTUP: ${FETCH_ON_STARTUP:-false}
      REQUIRE_DB_TABLES: public.sources,public.items,public.item_analysis,public.users,public.commodity_briefings,public.commodity_quotes,public.briefing_targets,public.briefing_template_fields,public.daily_push_config,public.daily_pushes,copilot.feature_flags
      DB_WAIT_TIMEOUT_SECONDS: "180"
    secrets:
      - db_password
    networks:
      - internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  copilot:
    image: harborssl.fegroup.cn/custom-project/fe-radar-copilot:${IMAGE_TAG:?在 Portainer 环境变量填不可变版本号或 digest（禁止 latest）}
    environment:
      - TZ=Asia/Shanghai
      - COPILOT_DB_URL_FILE=/run/secrets/copilot_db_url
      - COPILOT_INTERNAL_SECRET_FILE=/run/secrets/copilot_internal_secret
      - SERVICE_TOKEN_WORKER_FILE=/run/secrets/service_token_worker
      - WORKER_INTERNAL_URL=http://worker:8071
      - COPILOT_LLM_CONTEXT_SIZE=${COPILOT_LLM_CONTEXT_SIZE:-} # T-CH-01: 空/未设→默认 32768（仅 copilot 消费）
      - QWEN_BASE_URL=${QWEN_BASE_URL:?set QWEN_BASE_URL in Portainer stack environment}
      - QWEN_EMBEDDING_BASE_URL=${QWEN_EMBEDDING_BASE_URL:-}
      - QWEN_EMBEDDING_MODEL=${QWEN_EMBEDDING_MODEL:-qwen-embedding-1024}
      - QWEN_API_KEY=${QWEN_API_KEY:-local-qwen}
      - QWEN_EMBEDDING_API_KEY=${QWEN_EMBEDDING_API_KEY:-}
    secrets: [copilot_db_url, copilot_internal_secret, service_token_worker]
    networks: [internal]
    deploy: { replicas: 1 }
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"
        ]

  postgres:
    image: harborssl.fegroup.cn/custom-project/fe-radar/postgres-zhparser:pg16
    environment:
      POSTGRES_DB: fe_radar
      POSTGRES_USER: fe_radar
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      TZ: Asia/Shanghai
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  redis:
    image: harborssl.fegroup.cn/custom-project/redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redis_data:/data
    networks:
      - internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  minio:
    image: harborssl.fegroup.cn/custom-project/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets:
      - minio_root_user
      - minio_root_password
    volumes:
      - minio_data:/data
    networks:
      - internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  backup:
    image: harborssl.fegroup.cn/custom-project/fe-radar-backup:${IMAGE_TAG:?在 Portainer 环境变量填不可变版本号或 digest（禁止 latest）}
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: postgres://fe_radar:${DB_PASSWORD}@postgres:5432/fe_radar
      MINIO_ENDPOINT: http://minio:9000
      # T-SEC-17 (复核 F3): backup 只需读写 fe-radar-backups bucket，改用 scoped service account。
      MINIO_ACCESS_KEY_FILE: /run/secrets/minio_backup_access_key
      MINIO_SECRET_KEY_FILE: /run/secrets/minio_backup_secret_key
      MINIO_BUCKET: fe-radar-backups
      RETENTION_DAYS: "7"
    secrets:
      - db_password
      - minio_backup_access_key
      - minio_backup_secret_key
    networks:
      - internal
    deploy:
      replicas: 0
      restart_policy:
        condition: none

  grafana:
    image: harborssl.fegroup.cn/custom-project/grafana:12.1.1
    environment:
      TZ: Asia/Shanghai
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in Portainer stack environment}
      GRAFANA_DINGTALK_WEBHOOK_URL: ${GRAFANA_DINGTALK_WEBHOOK_URL:?set GRAFANA_DINGTALK_WEBHOOK_URL in Portainer stack environment}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
    secrets:
      - grafana_admin_password
    configs:
      - source: grafana_datasource_postgres
        target: /etc/grafana/provisioning/datasources/postgres.yaml
      - source: grafana_dashboard_provider
        target: /etc/grafana/provisioning/dashboards/fe-radar.yaml
      - source: grafana_alerts_commodity
        target: /etc/grafana/provisioning/alerting/commodity-briefing.yaml
      - source: grafana_alerts_core
        target: /etc/grafana/provisioning/alerting/fe-radar-core.yaml
      - source: grafana_contact_points
        target: /etc/grafana/provisioning/alerting/contact-points.yaml
      - source: grafana_dashboard_ops
        target: /etc/grafana/dashboards/fe-radar.json
      - source: grafana_dashboard_commodity
        target: /etc/grafana/dashboards/commodity-briefing.json
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # v1.1 commodity-briefing: RSSHub 内网自部署（供 rsshub-extract adapter 使用）
  rsshub:
    image: harborssl.fegroup.cn/custom-project/rsshub:20260615
    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      CACHE_EXPIRE: "3600"
      REDIS_URL: redis://redis:6379
    networks:
      - internal
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M
          cpus: "0.10"
      restart_policy:
        condition: any
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1200/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  internal:
    driver: overlay
    internal: true
  edge:
    driver: overlay
    # 不设 internal:true：允许 web 通过 ingress 对外发布端口

volumes:
  postgres_data:
  redis_data:
  minio_data:
  grafana_data:

secrets:
  db_password:
    external: true
  nextauth_secret:
    external: true
  dingtalk_app_secret:
    external: true
  deepseek_api_key:
    external: true
  kimi_api_key:
    external: true
  minio_root_user:
    external: true
  minio_root_password:
    external: true
  # T-SEC-17 (复核 F3): bucket/operation scoped service accounts（按 minio-least-privilege.md 预建）。
  # root 仅 MinIO service 自己持有；web/worker/backup 改用 scoped 账号。
  minio_web_access_key:
    external: true
  minio_web_secret_key:
    external: true
  minio_worker_access_key:
    external: true
  minio_worker_secret_key:
    external: true
  minio_backup_access_key:
    external: true
  minio_backup_secret_key:
    external: true
  proxy_list:
    external: true
  grafana_admin_password:
    external: true
  firecrawl_api_key:
    external: true
  datapro_agent_plan_key:
    external: true
  websearch_api_key:
    external: true
  copilot_db_url:
    external: true
  copilot_internal_secret:
    external: true
  service_token_worker:
    external: true

configs:
  grafana_datasource_postgres:
    file: ./grafana/provisioning/datasources/postgres.yaml
  grafana_dashboard_provider:
    file: ./grafana/provisioning/dashboards/commodity-briefing.yaml
  grafana_alerts_commodity:
    file: ./grafana/provisioning/alerts/commodity-briefing.yaml
  grafana_alerts_core:
    file: ./grafana/provisioning/alerts/fe-radar-core.yaml
  grafana_contact_points:
    file: ./grafana/provisioning/alerts/contact-points.yaml
  grafana_dashboard_ops:
    file: ./grafana/dashboards/fe-radar.json
  grafana_dashboard_commodity:
    file: ./grafana/dashboards/commodity-briefing.json

version: "3.9"

services:
  web:
    image: fe-radar/web:latest
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      DATABASE_URL: postgres://fe_radar:${DB_PASSWORD}@postgres:5432/fe_radar
      REDIS_URL: redis://redis:6379
      NEXTAUTH_URL: http://fe-radar.internal
      NEXTAUTH_SECRET_FILE: /run/secrets/nextauth_secret
    secrets:
      - nextauth_secret
      - db_password
    networks:
      - internal
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  worker:
    image: fe-radar/worker:latest
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      DATABASE_URL: postgres://fe_radar:${DB_PASSWORD}@postgres:5432/fe_radar
      REDIS_URL: redis://redis:6379
      PROXY_POOL_ENABLED: "false"
      PROXY_LIST_FILE: /run/secrets/proxy_list
      DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_api_key
      KIMI_API_KEY_FILE: /run/secrets/kimi_api_key
    secrets:
      - db_password
      - deepseek_api_key
      - kimi_api_key
      - proxy_list
    networks:
      - internal
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure

  scheduler:
    image: fe-radar/worker:latest
    command: ["node", "dist/scheduler.js"]
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      DATABASE_URL: postgres://fe_radar:${DB_PASSWORD}@postgres:5432/fe_radar
      REDIS_URL: redis://redis:6379
    secrets:
      - db_password
    networks:
      - internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  postgres:
    image: fe-radar/postgres-zhparser:pg16
    environment:
      POSTGRES_DB: fe_radar
      POSTGRES_USER: fe_radar
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      TZ: Asia/Shanghai
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redis_data:/data
    networks:
      - internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets:
      - minio_root_user
      - minio_root_password
    volumes:
      - minio_data:/data
    networks:
      - internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

networks:
  internal:
    driver: overlay
    internal: true

volumes:
  postgres_data:
  redis_data:
  minio_data:

secrets:
  db_password:
    external: true
  nextauth_secret:
    external: true
  dingtalk_app_secret:
    external: true
  deepseek_api_key:
    external: true
  kimi_api_key:
    external: true
  minio_root_user:
    external: true
  minio_root_password:
    external: true
  proxy_list:
    external: true

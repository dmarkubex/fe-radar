name: E2E

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  web-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fe_radar
          POSTGRES_PASSWORD: fe_radar
          POSTGRES_DB: fe_radar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fe_radar -d fe_radar"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgres://fe_radar:fe_radar@localhost:5432/fe_radar
      # 开源后请在 GitHub Repo → Settings → Secrets 配置 NEXTAUTH_SECRET_E2E；
      # 未配置时回退到下方占位符（仅 e2e 使用，非真实密钥，已在 .gitleaks.toml 放行）。
      AUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET_E2E || 'e2e-dummy-secret-not-for-production' }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET_E2E || 'e2e-dummy-secret-not-for-production' }}
      NEXTAUTH_URL: http://localhost:3000
      MIGRATION_PROFILE: e2e
      SEED_ADMIN_USERNAME: admin
      SEED_ADMIN_PASSWORD: admin-password
      SEED_VIEWER_USERNAME: viewer
      SEED_VIEWER_PASSWORD: viewer-password
      E2E_ADMIN_USERNAME: admin
      E2E_ADMIN_PASSWORD: admin-password
      E2E_VIEWER_USERNAME: viewer
      E2E_VIEWER_PASSWORD: viewer-password
      # E2E_COPILOT_STUB=1 只验 Copilot UI（免责 / 数据截止 / 无 a[href]），
      # 不得当作 S1/S2 主链验收。本 job 仍名 web-e2e，不要改名为 S1/S2 通过。
      # 尚无 copilot Playwright 规格，不硬编用例。
      E2E_COPILOT_STUB: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fe-radar/db migrate
      - run: pnpm --filter @fe-radar/db seed:admin
      - run: pnpm --filter @fe-radar/web build
      - run: pnpm --filter @fe-radar/web exec playwright install --with-deps chromium
      - run: pnpm --filter @fe-radar/web e2e
